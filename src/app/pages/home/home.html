<main id="main-content" class="home-page page-width" tabindex="-1">
  <header class="home-intro">
    <div>
      <p class="eyebrow">Início</p>
      <h1>Manual da marca<br /><em>Evena</em></h1>
    </div>
  </header>

  <section class="cards-grid" aria-label="Explore o manual da marca Evena">
    <a
      class="brand-card concept-card"
      routerLink="/conceito"
      aria-label="Explorar Conceito: propósito e posicionamento"
    >
      <h2>Conceito</h2>
      <p class="card-subtitle">propósito · posicionamento</p>
      <div class="concept-symbol" aria-hidden="true">
        <svg viewBox="0 0 100 84" focusable="false">
          <g class="crown-lines">
            <path pathLength="1" d="M14 22 L35 38" />
            <path pathLength="1" d="M35 38 L51 14" />
            <path pathLength="1" d="M51 14 L67 38" />
            <path pathLength="1" d="M67 38 L86 23" />
            <path pathLength="1" d="M86 23 L78 66" />
            <path pathLength="1" d="M78 66 L23 67" />
            <path pathLength="1" d="M23 67 L14 22" />
          </g>
          <g class="crown-dots">
            <circle cx="14" cy="22" r="3.2" />
            <circle cx="35" cy="38" r="3.2" />
            <circle cx="51" cy="14" r="3.2" />
            <circle cx="67" cy="38" r="3.2" />
            <circle cx="86" cy="23" r="3.2" />
            <circle cx="78" cy="66" r="3.2" />
            <circle cx="23" cy="67" r="3.2" />
          </g>
        </svg>
      </div>
    </a>

    <a
      class="brand-card vibe-card"
      routerLink="/vibe"
      aria-label="Explorar Vibe: tom de voz e personalidade"
    >
      <h2>Vibe</h2>
      <p class="card-subtitle">tom de voz · personalidade</p>
      <div class="vibe-symbol" aria-hidden="true">
        <svg viewBox="0 0 640 300" focusable="false">
          <g class="equalizer">
            <rect x="142" y="124" width="42" height="92" rx="21" />
            <rect x="210" y="80" width="42" height="180" rx="21" />
            <rect x="278" y="44" width="42" height="252" rx="21" />
            <rect x="346" y="92" width="42" height="156" rx="21" />
            <rect x="414" y="116" width="42" height="100" rx="21" />
          </g>
          <g class="smile-face">
            <path class="smile-arc" pathLength="1" d="M188 146 C252 228, 386 228, 452 146" />
            <circle cx="250" cy="112" r="17" />
            <circle cx="390" cy="112" r="17" />
          </g>
        </svg>
      </div>
    </a>

    <a
      class="brand-card aesthetic-card"
      routerLink="/estetica"
      aria-label="Explorar Estética: logo, cores, tipografia e aplicações"
    >
      <h2>Estética</h2>
      <p class="card-subtitle">logo · cores · tipo · aplicações</p>
      <div class="aesthetic-symbol" aria-hidden="true">
        <svg viewBox="0 0 680 400" focusable="false">
          <defs>
            <clipPath id="posterClipEvena">
              <rect x="122" y="118" width="330" height="245" rx="22" />
            </clipPath>
          </defs>
          <g class="posters">
            <rect class="poster p3" x="186" y="62" width="330" height="245" rx="22" />
            <rect class="poster p2" x="154" y="90" width="330" height="245" rx="22" />
            <g class="poster-main">
              <rect class="poster p1" x="122" y="118" width="330" height="245" rx="22" />
              <g clip-path="url(#posterClipEvena)">
                <rect class="poster-sky" x="122" y="118" width="330" height="245" />
                <circle class="sun" cx="238" cy="214" r="43" />
                <path
                  class="moon"
                  d="M274 171C248 176 230 198 236 224C242 252 276 267 302 250C282 249 264 238 256 220C246 198 254 181 274 171Z"
                />
                <path
                  class="hill"
                  d="M122 306 C184 240, 242 284, 304 306 C374 332, 416 236, 452 284 V363 H122Z"
                />
              </g>
            </g>
          </g>
        </svg>
      </div>
    </a>

    <a
      class="brand-card tagline-node"
      href="https://evena.online"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Viver é melhor ao vivo! Abrir o site Evena em nova aba"
    >
      <span class="tagline-text">Viver é <br />melhor <br /><em>ao vivo!</em></span>
      <span class="tagline-link">Acessar site</span>
    </a>
  </section>
</main>
